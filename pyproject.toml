[tool.poetry]
name = "distributed-payment-gateway"
version = "0.1.0"
description = "Distributed payment processing platform with gRPC microservices"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
  { include = "common", from = "packages" },
  { include = "transaction_service", from = "services/transaction_service" },
  { include = "fraud_service", from = "services/fraud_service" },
  { include = "gateway_api", from = "services/gateway_api" }
]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.115.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
grpcio = "^1.67.0"
grpcio-tools = "^1.67.0"
protobuf = "^5.28.0"
sqlalchemy = { version = "^2.0.34", extras = ["asyncio"] }
asyncpg = "^0.29.0"
alembic = "^1.14.0"
psycopg = { version = "^3.2.1", extras = ["binary"] }
pydantic = "^2.9.0"
pydantic-settings = "^2.5.2"
structlog = "^24.1.0"
loguru = "^0.7.2"
pybreaker = "^1.0.5"
apscheduler = "^3.10.4"
prometheus-client = "^0.21.0"
httpx = "^0.27.2"
typer = "^0.12.5"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
black = "^24.8.0"
isort = "^5.13.2"
ruff = "^0.6.9"
mypy = "^1.11.2"
tox = "^4.18.0"
types-protobuf = "^5.28.0"

[tool.poetry.scripts]
transaction-service = "transaction_service.app:run"
fraud-service = "fraud_service.app:run"
gateway-api = "gateway_api.app:run"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"

[tool.ruff]
exclude = ["packages/common/generated"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
mypy_path = ["packages", "services"]
plugins = ["pydantic.mypy"]
namespace_packages = true
ignore_missing_imports = true
exclude = ["packages/common/generated"]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
